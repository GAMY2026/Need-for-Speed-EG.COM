
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEED FOR SPEED | إدارة الموتوسيكلات</title>
<style>
:root{--bg:#080a0f;--panel:#11151e;--gold:#c8a96a;--text:#f4f4f4;--muted:#9ba3b2;--red:#d9473b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select{font:inherit}
.top{padding:22px 5%;border-bottom:1px solid #292d36;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:2px;color:var(--gold);font-size:22px}
.top a{color:var(--text);text-decoration:none}
main{width:min(1100px,92%);margin:32px auto}
h1{font-size:27px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 26px;line-height:1.8}
.panel{background:var(--panel);border:1px solid #292d36;border-radius:14px;padding:22px;margin-bottom:22px}
h2{font-size:19px;margin:0 0 18px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
label{display:block;color:#c8ccd5;font-size:14px;margin-bottom:7px}
input,select{width:100%;padding:12px;border:1px solid #343a48;border-radius:8px;background:#090c12;color:white;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button,.button{border:0;border-radius:8px;padding:11px 17px;cursor:pointer;font-weight:bold}
.primary{background:var(--gold);color:#111}
.secondary{background:#272d39;color:white}
.danger{background:#48201f;color:#ffb3ad}
.message{margin-top:14px;color:var(--gold);line-height:1.7}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:13px 10px;border-bottom:1px solid #292d36;text-align:right}
th{color:var(--gold);font-size:13px}
td{font-size:14px}
.tag{color:var(--muted)}
.row-actions{display:flex;gap:7px}
.row-actions button{padding:8px 10px}
#dashboard{display:none}
#loginScreen{max-width:430px;margin:65px auto}
#loginScreen .panel{padding:28px}
#loginMessage{color:#ffb3ad;line-height:1.7}
@media(max-width:600px){main{margin:22px auto}.fields{grid-template-columns:1fr}.panel{padding:16px}.top{padding:18px 4%}h1{font-size:23px}}

/* NEED FOR SPEED - Animated Admin Login */
#loginScreen.nfs-login-stage {
  position: relative;
  isolation: isolate;
  width: min(100%, 520px);
  max-width: 520px;
  margin: 45px auto;
  padding: 35px 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  border-radius: 22px;
  background: #090b12;
}

.nfs-login-glow {
  position: absolute;
  inset: 8px;
  z-index: -1;
  border-radius: 20px;
  background: linear-gradient(
    125deg,
    #8b5cf6,
    #ec4899,
    #d9473b,
    #c8a96a,
    #8b5cf6
  );
  background-size: 300% 300%;
  animation: nfsGradient 7s ease infinite;
  filter: blur(2px);
}

.nfs-login-card {
  width: 100%;
  max-width: 390px;
  padding: 38px 30px 25px;
  border: 1px solid #30303d;
  border-radius: 16px;
  background: rgba(12, 14, 22, .97);
  box-shadow: 0 18px 55px rgba(0, 0, 0, .5);
  animation: nfsLoginEnter .65s ease both;
}

.nfs-login-brand {
  color: #c8a96a;
  font-size: 15px;
  font-weight: 900;
  letter-spacing: 3px;
  text-align: center;
}

.nfs-login-line {
  width: 65px;
  height: 3px;
  margin: 17px auto 25px;
  border-radius: 10px;
  background: linear-gradient(90deg, #8b5cf6, #ec4899, #c8a96a);
}

.nfs-login-card h1 {
  margin: 0;
  color: #fff;
  font-size: 28px;
  text-align: center;
}

.nfs-login-subtitle {
  margin: 12px 0 28px;
  color: #a8adba;
  font-size: 14px;
  text-align: center;
}

.nfs-login-form label {
  display: block;
  margin: 17px 0 8px;
  color: #e3e4ea;
  font-size: 14px;
}

.nfs-login-form input {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid #343747;
  border-radius: 9px;
  outline: none;
  background: #11141e;
  color: #fff;
  transition: border-color .25s, box-shadow .25s;
}

.nfs-login-form input:focus {
  border-color: #c8a96a;
  box-shadow: 0 0 0 3px rgba(200, 169, 106, .12);
}

.nfs-login-form input::placeholder {
  color: #747b8d;
}

.nfs-login-button {
  width: 100%;
  min-height: 49px;
  margin-top: 25px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid #e3c887;
  border-radius: 9px;
  background: linear-gradient(110deg, #c8a96a, #f0d69a, #c8a96a);
  background-size: 200% auto;
  color: #111;
  font-weight: 900;
  cursor: pointer;
  transition: background-position .35s, transform .25s;
}

.nfs-login-button:hover {
  background-position: right center;
  transform: translateY(-2px);
}

.nfs-login-button:active {
  transform: scale(.98);
}

#loginMessage {
  min-height: 20px;
  margin: 13px 0 0;
  color: #ffaaa3;
  font-size: 13px;
  text-align: center;
}

.nfs-login-footer {
  margin-top: 24px;
  color: #62697a;
  font-size: 10px;
  letter-spacing: 3px;
  text-align: center;
}

@keyframes nfsGradient {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

@keyframes nfsLoginEnter {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  #loginScreen.nfs-login-stage {
    margin: 25px auto;
    padding: 25px 12px;
  }

  .nfs-login-card {
    padding: 30px 20px 22px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .nfs-login-glow,
  .nfs-login-card {
    animation: none;
  }
}  
</style>
</head>
<body>
<header class="top">
  <div class="brand">NEED FOR SPEED</div>
  <a href="./index.html">العودة إلى الموقع ↗</a>
</header>

<main>
<section id="loginScreen" class="nfs-login-stage">
  <div class="nfs-login-glow"></div>

 

    <section class="panel">
      <h2>الموديلات الحالية (<span id="bikeCount">0</span>)</h2>
      
<div style="margin-bottom:16px">
  <label for="bikeSearch">البحث عن موتوسيكل</label>
  <input
    id="bikeSearch"
    type="search"
    placeholder="ابحث بالاسم أو الفئة أو سعة المحرك..."
  >
</div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>الاسم</th><th>الفئة</th><th>المحرك</th><th>القوة</th><th>السعر</th><th>الإجراءات</th></tr></thead>
          <tbody id="bikeRows"></tbody>
        </table>
      </div>
      <p class="message" id="tableMessage" role="status"></p>
      <div class="actions"><button class="secondary" type="button" id="logout">تسجيل الخروج</button></div>
    </section>
  </section>
</main>

<script>
const BIKES_STORAGE_KEY = "nfs_bikes_v1";

/* بيانات الدخول التجريبية — غيّرها قبل التجربة */
const ADMIN_USER = "admin";
const ADMIN_PASS = "NFS2026";

let bikes = [];
let editingIndex = -1;

const $ = id => document.getElementById(id);

function loadBikes() {
  try {
    const saved = localStorage.getItem(BIKES_STORAGE_KEY);
    if (saved !== null) {
      const parsed = JSON.parse(saved);
      if (!Array.isArray(parsed)) throw new Error("بيانات غير صحيحة");
      bikes = parsed;
    } else {
      $("tableMessage").textContent =
        "لم يتم العثور على بيانات الموديلات. افتح الموقع الرئيسي أولًا من نفس المتصفح.";
      bikes = [];
    }
  } catch (error) {
    bikes = [];
    $("tableMessage").textContent =
      "تعذر قراءة البيانات المحلية. تأكد من فتح الموقع عبر GitHub Pages.";
  }
}

function saveBikes() {
  try {
    localStorage.setItem(BIKES_STORAGE_KEY, JSON.stringify(bikes));
    return true;
  } catch (error) {
    $("formMessage").textContent = "تعذر حفظ البيانات في المتصفح.";
    return false;
  }
}

function categoryName(type) {
  return ({sport:"رياضي",cruiser:"كروزر / كلاسيك",city:"مدينة"})[type] || type;
}

function renderBikes() {
  $("bikeCount").textContent = bikes.length;
  const body = $("bikeRows");
  body.replaceChildren();
const query = $("bikeSearch").value.trim().toLocaleLowerCase("ar");
  bikes.forEach((bike, index) => {
    const searchable = [
  bike.n,
  categoryName(bike.t),
  bike.cc,
  bike.hp,
  bike.p
].join(" ").toLocaleLowerCase("ar");

if (query && !searchable.includes(query)) return;
    const tr = document.createElement("tr");
    [bike.n, categoryName(bike.t), bike.cc, bike.hp, bike.p + " ج.م"].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value ?? "";
      tr.appendChild(td);
    });

    const actions = document.createElement("td");
    const wrap = document.createElement("div");
    wrap.className = "row-actions";

    const edit = document.createElement("button");
    edit.className = "secondary";
    edit.type = "button";
    edit.textContent = "تعديل";
    edit.addEventListener("click", () => editBike(index));

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.type = "button";
    remove.textContent = "حذف";
    remove.addEventListener("click", () => deleteBike(index));

    wrap.append(edit, remove);
    actions.appendChild(wrap);
    tr.appendChild(actions);
    body.appendChild(tr);
  });
}

function resetForm() {
  editingIndex = -1;
  $("bikeForm").reset();
  $("bikeColor").value = "#c8a96a";
  $("formTitle").textContent = "إضافة موتوسيكل جديد";
  $("saveBike").textContent = "حفظ الموتوسيكل";
  $("cancelEdit").hidden = true;
  $("formMessage").textContent = "";
}

function editBike(index) {
  const bike = bikes[index];
  if (!bike) return;
  editingIndex = index;
  $("bikeName").value = bike.n || "";
  $("bikeType").value = bike.t || "sport";
  $("bikeColor").value = bike.c || "#c8a96a";
  $("bikeCC").value = bike.cc || "";
  $("bikeHP").value = bike.hp || "";
  $("bikePrice").value = bike.p || "";
  $("formTitle").textContent = "تعديل بيانات الموتوسيكل";
  $("saveBike").textContent = "حفظ التعديلات";
  $("cancelEdit").hidden = false;
  $("formMessage").textContent = "";
  $("bikeForm").scrollIntoView({behavior:"smooth",block:"start"});
}

function deleteBike(index) {
  const bike = bikes[index];
  if (!bike) return;
  if (!confirm("هل أنت متأكد من حذف " + bike.n + "؟")) return;

  const previous = bikes.slice();
  bikes.splice(index, 1);
  if (!saveBikes()) {
    bikes = previous;
    return;
  }
  if (editingIndex === index) resetForm();
  renderBikes();
  $("tableMessage").textContent = "تم حذف الموتوسيكل وحفظ القائمة في هذا المتصفح.";
}
$("bikeSearch").addEventListener("input", renderBikes);
$("loginForm").addEventListener("submit", event => {
  event.preventDefault();
  if ($("username").value === ADMIN_USER &&
      $("password").value === ADMIN_PASS) {
    $("loginScreen").style.display = "none";
    $("dashboard").style.display = "block";
    $("loginMessage").textContent = "";
    loadBikes();
    renderBikes();
  } else {
    $("loginMessage").textContent = "اسم المستخدم أو كلمة المرور غير صحيحة.";
  }
});

$("bikeForm").addEventListener("submit", event => {
  event.preventDefault();

  const bike = {
    n: $("bikeName").value.trim(),
    t: $("bikeType").value,
    c: $("bikeColor").value.trim(),
    cc: $("bikeCC").value.trim(),
    hp: $("bikeHP").value.trim(),
    p: $("bikePrice").value.trim()
  };

  if (!/^#[0-9a-fA-F]{6}$/.test(bike.c)) {
    $("formMessage").textContent = "اكتب اللون بصيغة HEX مثل #c8a96a.";
    return;
  }

  const previous = bikes.slice();
  if (editingIndex >= 0) bikes[editingIndex] = bike;
  else bikes.push(bike);

  if (!saveBikes()) {
    bikes = previous;
    return;
  }

  renderBikes();
  resetForm();
  $("formMessage").textContent = "تم حفظ البيانات بنجاح في هذا المتصفح.";
  $("tableMessage").textContent =
    "التعديلات محفوظة محليًا، ولا تظهر تلقائيًا للزوار على أجهزتهم الأخرى.";
});

$("cancelEdit").addEventListener("click", resetForm);

$("logout").addEventListener("click", () => {
  $("dashboard").style.display = "none";
  $("loginScreen").style.display = "block";
  $("loginForm").reset();
  resetForm();
});
</script>
</body>
</html>
